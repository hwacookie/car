<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Circle Base -->
  <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- Inner Black Thin Line -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Black Outer Ring -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- 5 Diagonal Black Stripes (Zeichen 282 - Ende aller Streckenverbote) -->
  <g stroke="#000000" stroke-width="12" stroke-linecap="round">
    <line x1="80" y1="420" x2="420" y2="80" />
    <line x1="100" y1="440" x2="440" y2="100" />
    <line x1="120" y1="460" x2="460" y2="120" />
    <line x1="60" y1="400" x2="400" y2="60" />
    <line x1="40" y1="380" x2="380" y2="40" />
  </g>
</svg>