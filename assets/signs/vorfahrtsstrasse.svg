<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer border / Background padding -->
  <rect x="0" y="0" width="500" height="500" fill="none" />
  <g transform="rotate(45 250 250)">
    <!-- White outer diamond -->
    <rect x="80" y="80" width="340" height="340" rx="20" ry="20" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <!-- Black thin inner line border -->
    <rect x="90" y="90" width="320" height="320" rx="15" ry="15" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <!-- Yellow inner diamond -->
    <rect x="145" y="145" width="210" height="210" rx="8" ry="8" fill="#FFCC00" />
  </g>
</svg>